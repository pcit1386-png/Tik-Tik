:root{--bg:#f3f6fc;--card:#fff;--ink:#12203a;--mut:#667592;--line:#d8e0f0;--acc:#2f7bff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1f;--card:#0d1730;--ink:#e8eefc;--mut:#8da0c6;--line:#1c2d54;--acc:#4a90ff}}
:root[data-theme="dark"]{--bg:#070d1f;--card:#0d1730;--ink:#e8eefc;--mut:#8da0c6;--line:#1c2d54;--acc:#4a90ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:12px;cursor:pointer}
.tab.on{color:#fff;border-color:transparent;background:var(--c)}
.tab small{display:block;font-size:10px;font-weight:400;opacity:.8}
.pg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.pgt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);border-radius:9px;transition:width .3s}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-right:5px solid var(--k);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;user-select:none}
.it input{width:22px;height:22px;accent-color:var(--c);flex:0 0 auto}
.tm{font-size:12px;color:var(--mut);min-width:84px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.tx{flex:1;font-size:14px;font-weight:600}
.it.d{opacity:.5}.it.d .tx{text-decoration:line-through}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--mut);font-size:12px}
.rs{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:12px;padding:7px 12px;border-radius:10px;cursor:pointer}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:6px}
.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;background:var(--k)}
</style>

var day=(new Date().getDay()+1)%7,S={};
try{S=JSON.parse(localStorage.getItem("rt")||"{}")}catch(e){}
function save(){try{localStorage.setItem("rt",JSON.stringify(S))}catch(e){}}
function dn(n){return String(n).replace(/\d/g,function(d){return"۰۱۲۳۴۵۶۷۸۹"[d]})}
function draw(){
var c=D[day][1];document.documentElement.style.setProperty("--c",c);
document.getElementById("tabs").innerHTML=D.map(function(d,i){return'<button class="tab'+(i==day?' on':'')+'" style="--c:'+d[1]+'" data-i="'+i+'">'+d[0]+'</button>'}).join("");
var done=0,L=R[day];
document.getElementById("list").innerHTML=L.map(function(x,j){var k=day+"_"+j,on=S[k];if(on)done++;
return'<label class="it'+(on?' d':'')+'" style="--k:'+K[x[2]]+'"><input type="checkbox" data-k="'+k+'"'+(on?' checked':'')+'><span class="tm">'+x[0]+'</span><span class="tx">'+x[1]+'</span></label>'}).join("");
var p=Math.round(done/L.length*100);
document.getElementById("pl").textContent=D[day][0]+" · "+dn(done)+" از "+dn(L.length)+" کار انجام شد";
document.getElementById("pp").textContent=dn(p)+"٪";
document.getElementById("pb").style.width=p+"%";
}
document.getElementById("tabs").onclick=function(e){var b=e.target.closest(".tab");if(b){day=+b.dataset.i;draw()}};
document.getElementById("list").onchange=function(e){var k=e.target.dataset.k;if(k){if(e.target.checked)S[k]=1;else delete S[k];save();draw()}};
document.getElementById("rs").onclick=function(){R[day].forEach(function(_,j){delete S[day+"_"+j]});save();draw()};
draw();
</script>
